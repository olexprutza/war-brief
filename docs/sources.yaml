# SAM.gov queries
# Each entry becomes a separate API call. NAICS = North American Industry
# Classification System. PSC = Product or Service Code.
sam_queries:
  - name: Counter-UAS solicitations
    keywords: ["counter-UAS", "C-UAS", "counter unmanned"]
    posted_within_days: 7

  - name: Autonomous systems
    keywords: ["autonomous", "unmanned"]
    naics: ["541715", "336411"]   # R&D in physical/engineering, aircraft mfg
    posted_within_days: 7

  - name: OTA opportunities
    keywords: ["other transaction", "OTA"]
    posted_within_days: 14
