# war-brief sources
# Edit this file to add or remove sources. No code change needed.
# Feeds are pulled every run; items older than rss_lookback_days (default 3) are dropped.

rss_lookback_days: 3

rss_feeds:
  # ---- Primes and key contractors ----
  - name: Anduril
    url: https://www.anduril.com/feed/
    tags: [company, prime]

  - name: Palantir
    url: https://blog.palantir.com/feed
    tags: [company, prime]

  - name: SpaceX
    url: https://www.spacex.com/updates/rss.xml
    tags: [company, launch]

  - name: Kratos
    url: https://www.kratosdefense.com/feed
    tags: [company, prime]

  - name: Amazon Kuiper
    url: https://www.aboutamazon.com/news/tag/project-kuiper.rss
    tags: [company, space]

  # ---- Trade press ----
  - name: Breaking Defense
    url: https://breakingdefense.com/feed/
    tags: [press]

  - name: Defense News
    url: https://www.defensenews.com/arc/outboundfeeds/rss/?outputType=xml
    tags: [press]

  - name: War on the Rocks
    url: https://warontherocks.com/feed/
    tags: [press, analysis]

  - name: DefenseScoop
    url: https://defensescoop.com/feed/
    tags: [press]

  # ---- Acquisition reform analysts ----
  - name: Acquisition Talk (Eric Lofgren)
    url: https://acquisitiontalk.com/feed/
    tags: [analyst, acquisition-reform]

  - name: Defense Tech and Acquisition (Pete Modigliani)
    url: https://defenseacquisition.substack.com/feed
    tags: [analyst, acquisition-reform]

  # ---- Naval and maritime ----
  - name: CDR Salamander
    url: https://cdrsalamander.substack.com/feed
    tags: [analyst, naval]

  # ---- Think tanks ----
  # AEI is site-wide; fetch_rss.py filters by author.
  - name: AEI (filtered)
    url: https://www.aei.org/rss
    tags: [analyst, think-tank]
    author_filter:
      - Ross Douthat
      - Hal Brands
      - Kori Schake
      - Mackenzie Eaglen
      - Bill Greenwalt

  - name: Hoover Institution (filtered)
    url: https://www.hoover.org/rss.xml
    tags: [analyst, think-tank]
    author_filter:
      - Christian Brose
      - Jacquelyn Schneider
      - Niall Ferguson

  - name: CSIS
    url: https://www.csis.org/analysis/feed
    tags: [analyst, think-tank]

  - name: Special Competitive Studies Project (SCSP)
    url: https://scsp222.substack.com/feed
    tags: [analyst, think-tank, china]

  - name: Vandenberg Coalition
    url: https://vandenbergcoalition.org/feed/
    tags: [analyst, think-tank]

  # ---- Investor / founder commentary ----
  - name: Trae Stephens (Medium)
    url: https://medium.com/feed/@traestephens
    tags: [investor, anduril]

  - name: Noah Smith — Noahpinion
    url: https://www.noahpinion.blog/feed
    tags: [analyst, economics]

  # ---- Cultural / philosophical voices ----
  - name: Andy Crouch
    url: https://ahcrouch.substack.com/feed
    tags: [analyst, philosophy]

  - name: Andy Crouch (website)
    url: https://andy-crouch.com/feed
    tags: [analyst, philosophy]

# SAM.gov queries (used by brief.py)
sam_queries:
  - name: Counter-UAS solicitations
    keywords: ["counter-UAS", "C-UAS", "counter unmanned"]
    posted_within_days: 7

  - name: Autonomous systems
    keywords: ["autonomous", "unmanned"]
    naics: ["541715", "336411"]
    posted_within_days: 7

  - name: OTA opportunities
    keywords: ["other transaction", "OTA"]
    posted_within_days: 14
