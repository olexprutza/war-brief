name: war-brief

on:
  schedule:
    # 06:00 ET on Monday, Wednesday, Friday. Cron is UTC.
    # 10:30 UTC is 06:30 EDT / 05:30 EST. Adjust if you care about DST drift.
    - cron: '30 10 * * 1,3,5'
  workflow_dispatch:   # lets you run manually from the Actions tab

permissions:
  contents: write       # to commit the generated brief back to the repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch SAM.gov opportunities
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: python -m src.fetch_sam

      - name: Fetch RSS feeds
        run: python -m src.fetch_rss

      - name: Synthesize brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.synthesize

      - name: Render static site
        run: python -m src.render

      - name: Commit and push generated brief
        run: |
          git config user.name "war-brief bot"
          git config user.email "actions@github.com"
          git add public/
          git diff --staged --quiet || git commit -m "brief: $(date -u +%Y-%m-%d)"
          git push

  # Optional: separate deploy step if using GitHub Pages from /public
  # See https://docs.github.com/en/pages for the cleaner Pages action approach.
