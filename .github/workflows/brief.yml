name: war-brief

on:
  schedule:
    # Monday, Wednesday, Friday at 10:30 UTC. That is 06:30 EDT in summer / 05:30 EST in winter.
    - cron: '30 10 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write       # to commit the generated brief back to the repo
  pages: write          # to deploy to GitHub Pages
  id-token: write       # required by the Pages deploy action

# Avoid two runs trying to deploy at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
        run: python brief.py

      - name: Commit dated archive
        run: |
          git config user.name "war-brief bot"
          git config user.email "actions@github.com"
          git add public/
          git diff --staged --quiet || git commit -m "brief: $(date -u +%Y-%m-%d)"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
